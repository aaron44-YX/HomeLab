---
- name: Install PHP-FPM, MariaDB and WordPress dependencies
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-gd"
      - "php{{ php_version }}-intl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-zip"
      - mariadb-server
      - python3-pymysql
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Ensure PHP-FPM and MariaDB are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - "php{{ php_version }}-fpm"
    - mariadb

# These two tasks do what mysql_secure_installation does.
# Ubuntu's MariaDB already uses socket auth for root and listens on localhost only,
# so on a fresh install they usually report "ok" (nothing to fix).
- name: Remove anonymous database users
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove the test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create the WordPress database
  community.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

# update_password: on_create keeps re-runs idempotent.
# To rotate the password later, change it in the vault and set this to "always" once.
- name: Create the dedicated WordPress database user
  community.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    password: "{{ wp_db_password }}"
    host: localhost
    priv: "{{ wp_db_name }}.*:ALL"
    update_password: on_create
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
#  no_log: true

- name: Install WP-CLI
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
    dest: /usr/local/bin/wp
    owner: root
    group: root
    mode: "0755"

- name: Ensure the WordPress directory exists
  ansible.builtin.file:
    path: "{{ wp_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: WordPress install steps (run as www-data)
  become_user: www-data
  environment:
    WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
  block:
    - name: Download WordPress core
      ansible.builtin.command:
        argv:
          - wp
          - core
          - download
          - "--path={{ wp_path }}"
          - --locale=en_US
        chdir: "{{ wp_path }}"
        creates: "{{ wp_path }}/wp-load.php"

    - name: Create wp-config.php
      ansible.builtin.command:
        argv:
          - wp
          - config
          - create
          - "--path={{ wp_path }}"
          - "--dbname={{ wp_db_name }}"
          - "--dbuser={{ wp_db_user }}"
          - "--dbpass={{ wp_db_password }}"
          - --dbhost=localhost
        chdir: "{{ wp_path }}"
        creates: "{{ wp_path }}/wp-config.php"
      no_log: true

    - name: Check whether WordPress is already installed
      ansible.builtin.command:
        argv:
          - wp
          - core
          - is-installed
          - "--path={{ wp_path }}"
        chdir: "{{ wp_path }}"
      register: wp_installed
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Run the WordPress installer
      ansible.builtin.command:
        argv:
          - wp
          - core
          - install
          - "--path={{ wp_path }}"
          - "--url=http://{{ wp_domain }}"
          - "--title={{ wp_title }}"
          - "--admin_user={{ wp_admin_user }}"
          - "--admin_password={{ wp_admin_password }}"
          - "--admin_email={{ wp_admin_email }}"
          - --skip-email
        chdir: "{{ wp_path }}"
      when: wp_installed.rc != 0
      no_log: true
